<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virus! Homebrew Companion</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="controles-superiores">
        <select id="modo-juego">
            <option value="manual">Modo Manual (Esperar botón)</option>
            <option value="auto">Modo Automático (Cambio directo)</option>
        </select>
        <label>
            <input type="number" id="tiempo-aviso" value="5" min="1" max="15" style="width: 40px;"> s. aviso
        </label>
    </div>

    <div class="contenedor-carta">
        <div class="carta" id="carta-actual">
            <h2 id="titulo-carta">Preparando mazo...</h2>
            <p id="descripcion-carta">Presiona Iniciar para comenzar</p>
        </div>
    </div>

    <div class="reloj">
        <span id="cronometro">00</span>s
    </div>

    <div class="controles-inferiores">
        <button id="btn-iniciar">Iniciar Partida</button>
        <button id="btn-siguiente" class="oculto">Revelar Siguiente Evento</button>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
