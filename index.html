<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virus! Companion</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="controles-superiores">
        <select id="selector-modo">
            <option value="comodin_manual">Comodín: Manual</option>
            <option value="comodin_frenetico">Comodín: Frenético</option>
            <option value="emergencia_fija">Emergencia: Fija (Manual)</option>
            <option value="emergencia_dinamica">Emergencia: Dinámica</option>
        </select>

        <div id="config-tiempo" class="oculto">
            <label>Ciclo: <input type="number" id="tiempo-input" value="45" min="10" style="width: 50px;">s</label>
        </div>
    </div>

    <div class="contenedor-carta">
        <div class="carta" id="carta-actual">
            <h2 id="titulo-carta">Selecciona un modo</h2>
            <p id="descripcion-carta">Presiona Iniciar para revelar carta</p>
        </div>
    </div>

    <div class="reloj" id="contenedor-reloj">
        <span id="cronometro">--</span><span style="font-size: 1rem;">s</span>
    </div>

    <div class="controles-inferiores">
        <button id="btn-accion">Iniciar / Revelar</button>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
